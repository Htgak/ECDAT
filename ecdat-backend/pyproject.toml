[project]
name = "ecdat-backend"
version = "0.1.0"
description = "Enterprise Cryptographic Discovery & Analysis Tool — Backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "ECDAT Team" }]

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    # HTTP client
    "httpx>=0.28.0",
    # Source scanning
    "tree-sitter>=0.24.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-python>=0.23.0",
    # Crypto / evidence
    "cryptography>=44.0.0",
    "certifi>=2024.12.14",
    # CLI
    "typer>=0.15.0",
    "rich>=13.9.0",
    # TOML parsing (dependency scanners)
    "tomli>=2.2.0",
    # YAML (rules engine)
    "pyyaml>=6.0.2",
    # Logging
    "structlog>=24.4.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",         # async test client
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
    "factory-boy>=3.3.1",
]

[project.scripts]
ecdat = "ecdat.apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecdat"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "DTZ", "T20", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["ecdat"]
omit = ["tests/*", "alembic/*"]
