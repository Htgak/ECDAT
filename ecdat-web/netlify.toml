# Netlify Configuration File (when Base Directory is set to ecdat-web)

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# Proxy API and health requests to your Render backend
# IMPORTANT: Replace https://ecdat-backend.onrender.com with your actual Render URL
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://ecdat-sjpu.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "https://ecdat-sjpu.onrender.com/health"
  status = 200
  force = true

[[redirects]]
  from = "/ready"
  to = "https://ecdat-sjpu.onrender.com/ready"
  status = 200
  force = true

# -----------------------------------------------------------------------------
# SPA routing fallback: send all other paths to index.html
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
